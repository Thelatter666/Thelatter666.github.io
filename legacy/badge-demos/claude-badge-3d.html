    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;

  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    color: rgba(255,235,220,.35); font-size: 13px; letter-spacing: .12em;
    user-select: none; pointer-events: none;
  }
  .title {
    position: fixed; top: 36px; left: 50%; transform: translateX(-50%);
    color: rgba(255,240,230,.9); font-size: 15px; letter-spacing: .5em;
    font-weight: 300; user-select: none; pointer-events: none;
    text-transform: uppercase;
  }
</style>

<div class="hint">拖拽旋转 · 滚轮缩放</div>

// ---------- 场景基础 ----------
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d0908, 40, 90);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3.2, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// 环境贴图：金属反射的关键
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---------- 灯光 ----------
const keyLight = new THREE.DirectionalLight(0xfff1e6, 2.2);
keyLight.position.set(12, 20, 14);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -20; keyLight.shadow.camera.right = 20;
keyLight.shadow.camera.top = 20;  keyLight.shadow.camera.bottom = -20;
keyLight.shadow.radius = 8;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xd97757, 1.6);
rimLight.position.set(-16, 6, -12);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0xffe4d4, 0.3));

// ---------- 轮廓 → Shape ----------
const shape = new THREE.Shape(
  CONTOUR.map(([x, y]) => new THREE.Vector2(x, y))
);

// ---------- 挤出：徽章主体 ----------
const THICKNESS = 1.5;      // 徽章厚度
const BEVEL = 0.2;          // 倒角尺寸

const geo = new THREE.ExtrudeGeometry(shape, {
  depth: THICKNESS,
  steps: 1,
  curveSegments: 12,
  bevelEnabled: true,
  bevelThickness: BEVEL,
  bevelSize: BEVEL * 0.7,
  bevelOffset: 0,
  bevelSegments: 6,
});

geo.center();
geo.computeVertexNormals();

const mesh = new THREE.Mesh(
  geo,
  new THREE.MeshPhysicalMaterial({
    color: 0xd98f6c,          // 陶土铜，呼应 Claude 品牌色 #D97757
    metalness: 1.0,
    roughness: 0.26,
    clearcoat: 0.6,
    clearcoatRoughness: 0.25,
    envMapIntensity: 1.15,
  })
);
mesh.scale.setScalar(0.95);
mesh.castShadow = true;
mesh.receiveShadow = true;

const badge = new THREE.Group();
badge.add(mesh);
badge.rotation.x = -0.12;
scene.add(badge);

// ---------- 地面（接影） ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -11;
ground.receiveShadow = true;
scene.add(ground);

// ---------- 交互 ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 16;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- 渲染循环 ----------
const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  badge.position.y = Math.sin(t * 0.8) * 0.35;  // 轻微悬浮呼吸
  controls.update();
  renderer.render(scene, camera);
})();
</script>
